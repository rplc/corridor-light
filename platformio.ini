[platformio]
extra_configs = platformio.local.ini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.3
    ; WICHTIG: setGateSensitivity()/setMaxValues() (fuer das Radar-Fine-
    ; Tuning) sind zwar in der README dokumentiert, aber im aktuell
    ; neuesten Release-Tag (v0.2.2, PlatformIO-Registry) NOCH NICHT
    ; enthalten - die README spiegelt bereits den main-Branch wider.
    ; Sollte "richtig" getagged werden, sobald neue Version draußen ist
    ; ncmreynolds/ld2410@^0.2.2
    https://github.com/ncmreynolds/ld2410.git#9e202ad6f2340bc79ee0dd802e1ef58b0ae2cfa2

build_flags =
    -D WIFI_SSID=\"${secrets.wifi_ssid}\"
    -D WIFI_PASSWORD=\"${secrets.wifi_password}\"
    -D OTA_PASSWORD=\"${secrets.ota_password}\"
    -D MQTT_SERVER=\"${secrets.mqtt_server}\"
    -D MQTT_USER=\"${secrets.mqtt_user}\"
    -D MQTT_PASSWORD=\"${secrets.mqtt_password}\"
    -D RADAR_DEBUG_TELEMETRY=1

[env:d1_mini_ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = ${secrets.ota_host}
upload_flags =
    --auth=${secrets.ota_password}
