<svg viewBox="0 0 1300 950" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1300" height="950" fill="#ffffff"/>
  <text x="650" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">ESP8266 12V LED-Strip Controller — Wiring</text>

  <!-- ================= 12V PSU ================= -->
  <rect x="40" y="100" width="160" height="70" rx="6" fill="#fde68a" stroke="#92600a" stroke-width="1.5"/>
  <text x="120" y="130" text-anchor="middle" font-size="14" font-weight="bold">12V Netzteil</text>
  <text x="120" y="150" text-anchor="middle" font-size="12">(Barrel Jack)</text>

  <!-- 12V+ to UBEC -->
  <line x1="200" y1="125" x2="280" y2="125" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="240" y="117" text-anchor="middle" font-size="11" fill="#c2410c">12V+</text>

  <!-- ================= UBEC ================= -->
  <rect x="280" y="100" width="140" height="70" rx="6" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="350" y="128" text-anchor="middle" font-size="14" font-weight="bold">UBEC</text>
  <text x="350" y="146" text-anchor="middle" font-size="12">12V → 5V</text>

  <!-- 5V rail: UBEC -> ESP -->
  <line x1="420" y1="125" x2="500" y2="125" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="460" y="117" text-anchor="middle" font-size="11" fill="#b91c1c">5V</text>

  <!-- 5V rail branch down and over to radar (routed below the ESP box, no crossing) -->
  <path d="M430,135 L430,345 L1050,345 L1050,360" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="337" text-anchor="middle" font-size="11" fill="#b91c1c">5V (auch für Radar)</text>

  <!-- ================= ESP8266 ================= -->
  <rect x="500" y="70" width="230" height="260" rx="8" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/>
  <text x="615" y="95" text-anchor="middle" font-size="15" font-weight="bold">ESP8266</text>
  <text x="615" y="112" text-anchor="middle" font-size="11">(Wemos D1 Mini)</text>
  <line x1="510" y1="122" x2="720" y2="122" stroke="#c7d2fe"/>
  <text x="515" y="143" font-size="12">5V   ← UBEC 5V</text>
  <text x="515" y="166" font-size="12">GND  → gem. Masse</text>
  <text x="515" y="196" font-size="12">D1 (GPIO5)</text>
  <text x="515" y="226" font-size="12">D2 (GPIO4)</text>
  <text x="515" y="256" font-size="12">D5 (GPIO14)</text>
  <text x="515" y="286" font-size="12">D6 (GPIO12)</text>
  <text x="615" y="315" text-anchor="middle" font-size="10" fill="#555">WLAN + OTA (kabellos)</text>

  <!-- ESP pin exit points (right edge) -->
  <!-- D1 -> Gate -->
  <line x1="730" y1="192" x2="800" y2="192" stroke="#4c1d95" stroke-width="2"/>
  <text x="765" y="184" text-anchor="middle" font-size="10" fill="#4c1d95">→ Gate</text>
  <!-- D2 -> Switch -->
  <line x1="730" y1="222" x2="800" y2="222" stroke="#7c2d12" stroke-width="2"/>
  <text x="765" y="214" text-anchor="middle" font-size="10" fill="#7c2d12">← Schalter</text>
  <!-- D5 <- Radar TX -->
  <line x1="730" y1="252" x2="800" y2="252" stroke="#14532d" stroke-width="2"/>
  <text x="765" y="244" text-anchor="middle" font-size="10" fill="#14532d">← Radar TX</text>
  <!-- D6 -> Radar RX -->
  <line x1="730" y1="282" x2="800" y2="282" stroke="#14532d" stroke-width="2"/>
  <text x="765" y="274" text-anchor="middle" font-size="10" fill="#14532d">→ Radar RX</text>

  <!-- ESP GND down to common bus -->
  <line x1="560" y1="330" x2="560" y2="860" stroke="#111" stroke-width="2"/>

  <!-- ================= Gate network (D1 -> 220R -> Gate, Gate -> 10k -> GND) ================= -->
  <line x1="800" y1="192" x2="950" y2="192" stroke="#4c1d95" stroke-width="2"/>
  <rect x="885" y="185" width="34" height="14" fill="#fff" stroke="#4c1d95"/>
  <text x="902" y="196" text-anchor="middle" font-size="9">220Ω</text>
  <line x1="950" y1="192" x2="950" y2="430" stroke="#4c1d95" stroke-width="2"/>
  <line x1="950" y1="430" x2="880" y2="430" stroke="#4c1d95" stroke-width="2"/>
  <!-- down into Gate pin of MOSFET -->
  <line x1="880" y1="430" x2="880" y2="460" stroke="#4c1d95" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="452" font-size="10" fill="#4c1d95">Gate</text>
  <!-- pulldown branch to the right of the MOSFET body, down to GND bus -->
  <line x1="950" y1="430" x2="1030" y2="430" stroke="#4c1d95" stroke-width="2"/>
  <rect x="1015" y="560" width="34" height="14" fill="#fff" stroke="#4c1d95"/>
  <text x="1032" y="571" text-anchor="middle" font-size="9">10kΩ</text>
  <line x1="1030" y1="430" x2="1030" y2="560" stroke="#4c1d95" stroke-width="2"/>
  <line x1="1030" y1="574" x2="1030" y2="860" stroke="#4c1d95" stroke-width="2"/>
  <text x="1030" y="605" text-anchor="middle" font-size="9" fill="#4c1d95">Pulldown</text>
  <text x="1030" y="617" text-anchor="middle" font-size="9" fill="#4c1d95">(Gate → GND)</text>

  <!-- ================= LED strip ================= -->
  <rect x="500" y="480" width="180" height="70" rx="6" fill="#fecaca" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="590" y="508" text-anchor="middle" font-size="14" font-weight="bold">12V LED-Strip</text>
  <text x="590" y="526" text-anchor="middle" font-size="11">V+ (links) / V- (rechts)</text>

  <!-- 12V+ rail from PSU down to LED strip V+ -->
  <path d="M120,170 L120,515" fill="none" stroke="#c2410c" stroke-width="3"/>
  <line x1="120" y1="515" x2="500" y2="515" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="507" text-anchor="middle" font-size="11" fill="#c2410c">12V+</text>

  <!-- LED strip V- -> MOSFET Drain -->
  <line x1="680" y1="515" x2="800" y2="515" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="740" y="507" text-anchor="middle" font-size="11">V- → Drain</text>

  <!-- ================= MOSFET IRLB8721 ================= -->
  <rect x="800" y="460" width="180" height="120" rx="6" fill="#ddd6fe" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="890" y="486" text-anchor="middle" font-size="14" font-weight="bold">IRLB8721</text>
  <text x="890" y="506" text-anchor="middle" font-size="11">Drain (D) ← LED V-</text>
  <text x="890" y="524" text-anchor="middle" font-size="11">Gate (G) ← 220Ω/10kΩ</text>
  <text x="890" y="542" text-anchor="middle" font-size="11">Source (S) → GND</text>

  <!-- MOSFET source -> common GND -->
  <line x1="890" y1="580" x2="890" y2="860" stroke="#111" stroke-width="2.5"/>

  <!-- ================= HLK-LD2410C Radar ================= -->
  <rect x="1050" y="360" width="200" height="110" rx="6" fill="#bbf7d0" stroke="#14532d" stroke-width="1.5"/>
  <text x="1150" y="386" text-anchor="middle" font-size="14" font-weight="bold">HLK-LD2410C</text>
  <text x="1150" y="406" text-anchor="middle" font-size="11">VCC ← 5V (UBEC)</text>
  <text x="1150" y="424" text-anchor="middle" font-size="11">GND → gem. Masse</text>
  <text x="1150" y="442" text-anchor="middle" font-size="11">TX → ESP D5 (RX)</text>
  <text x="1150" y="458" text-anchor="middle" font-size="11">RX ← ESP D6 (TX)</text>

  <!-- Radar TX -> ESP D5 -->
  <path d="M1050,405 L990,405 L990,252 L800,252" fill="none" stroke="#14532d" stroke-width="2"/>
  <!-- Radar RX <- ESP D6 -->
  <path d="M1050,425 L1010,425 L1010,282 L800,282" fill="none" stroke="#14532d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Radar GND -> common bus -->
  <line x1="1150" y1="470" x2="1150" y2="860" stroke="#111" stroke-width="2"/>

  <!-- ================= Switch ================= -->
  <rect x="40" y="620" width="190" height="80" rx="6" fill="#fed7aa" stroke="#7c2d12" stroke-width="1.5"/>
  <text x="135" y="648" text-anchor="middle" font-size="14" font-weight="bold">Schalter (SPDT)</text>
  <text x="135" y="666" text-anchor="middle" font-size="11">C → GND</text>
  <text x="135" y="684" text-anchor="middle" font-size="11">N.O. → ESP D2</text>

  <!-- Switch N.O. -> ESP D2 (crosses the 12V rail with a visible jump, see above) -->
  <path d="M135,620 L135,222 L500,222" fill="none" stroke="#7c2d12" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="214" text-anchor="middle" font-size="10" fill="#7c2d12">N.O. Pin — offen=HIGH (INPUT_PULLUP), geschlossen=LOW</text>

  <!-- Switch C -> GND -->
  <line x1="135" y1="700" x2="135" y2="860" stroke="#111" stroke-width="2"/>

  <!-- ================= Common GND bus ================= -->
  <line x1="70" y1="860" x2="1200" y2="860" stroke="#111" stroke-width="3"/>
  <text x="635" y="880" text-anchor="middle" font-size="12" font-weight="bold">gemeinsame Masse (GND) — PSU / UBEC / ESP / MOSFET Source / LED- / Radar / Schalter</text>

  <!-- PSU GND -> common bus -->
  <line x1="70" y1="170" x2="70" y2="860" stroke="#111" stroke-width="2.5"/>
  <!-- UBEC GND -> common bus -->
  <line x1="295" y1="170" x2="295" y2="860" stroke="#111" stroke-width="2"/>

  <!-- ================= Legend ================= -->
  <g font-size="11">
    <line x1="40" y1="920" x2="70" y2="920" stroke="#c2410c" stroke-width="3"/>
    <text x="76" y="924">12V</text>
    <line x1="150" y1="920" x2="180" y2="920" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="186" y="924">5V</text>
    <line x1="260" y1="920" x2="290" y2="920" stroke="#14532d" stroke-width="2"/>
    <text x="296" y="924">UART (3.3V)</text>
    <line x1="400" y1="920" x2="430" y2="920" stroke="#4c1d95" stroke-width="2"/>
    <text x="436" y="924">Gate-Netzwerk</text>
    <line x1="560" y1="920" x2="590" y2="920" stroke="#111" stroke-width="2.5"/>
    <text x="596" y="924">GND</text>
  </g>
</svg>
